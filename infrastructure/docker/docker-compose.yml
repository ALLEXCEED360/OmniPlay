# Local development dependencies for OMNIPLAY.
#
# Postgres carries pg_trgm (fuzzy game-title lookup) and citext. Redis backs
# the BullMQ sync queues.
services:
  postgres:
    image: postgres:17-alpine
    container_name: omniplay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniplay
      POSTGRES_PASSWORD: omniplay
      POSTGRES_DB: omniplay
    ports:
      - "5433:5432"
    volumes:
      - omniplay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniplay -d omniplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: omniplay-redis
    restart: unless-stopped
    # BullMQ requires this eviction policy; the default can silently drop jobs.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - omniplay-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omniplay-pgdata:
  omniplay-redisdata:
