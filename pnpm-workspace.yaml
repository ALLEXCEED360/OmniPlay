packages:
  - "apps/*"
  - "packages/*"

# Dependencies permitted to run install scripts. pnpm blocks these by default;
# each one here is a native/codegen build we actually need.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # Optional native accelerator for msgpackr (a BullMQ dependency). msgpackr
  # falls back to its pure-JS path, so we skip the native build rather than
  # require a toolchain on every contributor's machine.
  msgpackr-extract: false
